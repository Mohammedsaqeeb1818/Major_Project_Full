<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Study Planner - SuccessAI</title>
</head>

<body>

    <h1>📚 AI Study Planner</h1>

    <p>
        Create a personalized study plan based on
        your academic performance and study goals.
    </p>

    <hr>

    <h2>Student Study Details</h2>

    <label for="difficult_subject">
        Difficult Subject:
    </label>

    <input
        type="text"
        id="difficult_subject"
        placeholder="Example: DBMS"
    >

    <br><br>

    <label for="study_goal">
        Study Goal:
    </label>

    <select id="study_goal">

        <option value="">
            Select Goal
        </option>

        <option value="Improve SGPA">
            Improve SGPA
        </option>

        <option value="Pass All Subjects">
            Pass All Subjects
        </option>

        <option value="Prepare for Exams">
            Prepare for Exams
        </option>

        <option value="Clear Backlogs">
            Clear Backlogs
        </option>

    </select>

    <br><br>

    <label for="available_hours">
        Available Study Hours Per Day:
    </label>

    <input
        type="number"
        id="available_hours"
        min="1"
        max="12"
        placeholder="Example: 2"
    >

    <br><br>

   <button type="button" onclick="generateStudyPlan()">
    Generate Study Plan
</button>

    <hr>

    <h2>Your AI Study Plan</h2>

    <p id="study-plan-output">
        Your personalized study plan will appear here.
    </p>


<script>
    async function generateStudyPlan() {
        const difficultSubject =
            document.getElementById("difficult_subject").value;

        const studyGoal =
            document.getElementById("study_goal").value;

        const availableHours =
            document.getElementById("available_hours").value;

        const output =
            document.getElementById("study-plan-output");

        if (!difficultSubject || !studyGoal || !availableHours) {
            output.innerText = "Please fill all fields.";
            return;
        }

        output.innerText = "Generating your study plan...";

        try {
            const response = await fetch("/generate-study-plan", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    difficult_subject: difficultSubject,
                    study_goal: studyGoal,
                    available_hours: availableHours
                })
            });

            const data = await response.json();

            if (!response.ok) {
                output.innerText = data.error;
                return;
            }

           output.innerHTML = `
    <h3>🤖 AI Generated Study Plan</h3>

    <p><strong>Subject:</strong> ${data.subject}</p>

    <p><strong>Goal:</strong> ${data.goal}</p>

    <p><strong>Available Hours:</strong> ${data.hours}</p>

   <div class="ai-plan">
    ${data.plan
        .replace(/\\/g, "")
        .replace(/^### (.*)$/gm, "<h3>$1</h3>")
        .replace(/^#### (.*)$/gm, "<h4>$1</h4>")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/^- (.*)$/gm, "• $1")
        .replace(/\n/g, "<br>")
    }
</div>
`;

        } catch (error) {
    output.innerText = "Error: " + error.message;
    console.error("Study Planner Error:", error);
}
    }
</script>


</body>

</html>
